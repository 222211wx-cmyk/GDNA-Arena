name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: artifacts/gdna-arena-mobile
    env:
      CI: 'true'
      NODE_OPTIONS: --max-old-space-size=4096
      EXPO_PUBLIC_API_ORIGIN: ${{ vars.EXPO_PUBLIC_API_ORIGIN }}
      EXPO_PUBLIC_DOMAIN: ${{ vars.EXPO_PUBLIC_DOMAIN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install workspace dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile --prod=false

      - name: Generate Android with the installed Expo SDK
        run: pnpm exec expo prebuild --platform android --clean --no-install

      - name: Verify Android Node resolution and autolinking
        run: |
          node --version
          pnpm --version
          (
            cd android
            node --print "require.resolve('@react-native/gradle-plugin/package.json', { paths: [require.resolve('react-native/package.json')] })"
            node --print "require.resolve('expo-modules-autolinking/package.json', { paths: [require.resolve('expo/package.json')] })"
          )
          pnpm exec expo-modules-autolinking react-native-config --platform android --json > /tmp/gdna-native-config.json
          node -e "JSON.parse(require('fs').readFileSync('/tmp/gdna-native-config.json', 'utf8'))"

      - name: Use the runner Android SDK
        run: |
          SDK_PATH="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$SDK_PATH" || ! -d "$SDK_PATH" ]]; then
            echo "::error::Android SDK is missing from the runner"
            exit 1
          fi
          printf 'sdk.dir=%s\n' "$SDK_PATH" > android/local.properties

      - name: Build release APK
        working-directory: artifacts/gdna-arena-mobile/android
        run: |
          chmod +x gradlew
          ./gradlew --version
          ./gradlew assembleRelease --no-daemon --stacktrace --info --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: gdna-arena-apk
          path: artifacts/gdna-arena-mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error