kind = "api"
previewPath = "/api"
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "pnpm --filter @workspace/api-server run dev"

[services.production]
[services.production.build]
args = ["pnpm", "--filter", "@workspace/api-server", "run", "build"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
args = ["node", "--enable-source-maps", "artifacts/api-server/dist/index.mjs"]

[services.production.run.env]
PORT = "8080"
NODE_ENV = "production"
AGORA_APP_ID = "62585b9b53c44c47baa7600ee5d74e54"

[services.production.health.startup]
path = "/api/healthz"

[[services]]
localPort = 8082
name = "Media Worker"
paths = ["/internal-media-worker"]

[services.development]
run = "pnpm --filter @workspace/api-server run worker:dev"

[services.production]
[services.production.run]
args = ["node", "--enable-source-maps", "artifacts/api-server/dist/media-worker.mjs"]

[services.production.run.env]
PORT = "8082"
NODE_ENV = "production"

[services.production.health.startup]
path = "/healthz"