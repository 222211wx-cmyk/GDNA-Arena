kind = "web"
previewPath = "/"
title = "GDNA Arena"
version = "1.0.0"
id = "artifacts/gdna-arena"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22842

[services.development]
run = "pnpm --filter @workspace/gdna-arena run dev"

[services.production]
publicDir = "artifacts/gdna-arena/dist/public"
serve = "static"

[services.production.build]
args = [ "pnpm", "--filter", "@workspace/gdna-arena", "run", "build" ]

[services.production.build.env]
BASE_PATH = "/"
NODE_ENV = "production"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22842"
BASE_PATH = "/"
