kind = "mobile"
previewPath = "/mobile/"
title = "GDNA Arena Mobile"
description = "Native mobile companion app for GDNA Arena — play games, vote on GlobalStar, chat with GDN-AI, and track your empire stats from your phone. Mirrors the dark neon design of the web app with full multi-language support."
version = "1.0.0"
id = "artifacts/gdna-arena-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/mobile/" ]
localPort = 19130

[services.development]
run = "pnpm --filter @workspace/gdna-arena-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/gdna-arena-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/gdna-arena-mobile", "run", "serve" ]

[services.env]
PORT = "19130"
BASE_PATH = "/mobile/"
