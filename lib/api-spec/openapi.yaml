openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: call-push
  - name: leaderboard
  - name: games
  - name: messages
  - name: rewards
  - name: wallet
  - name: globalstar
paths:
  /upload/presign:
    post:
      operationId: presignClipUpload
      description: Owner-authorized direct R2 multipart upload. 5 MiB parts, maximum 10 GiB (2048 parts). No clip bytes accepted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, expectedOwnerId]
              properties:
                action: { type: string, enum: [initiate, part, inspect, abort, complete] }
                expectedOwnerId: { type: integer }
                requestId: { type: string, format: uuid }
                sessionId: { type: string, format: uuid }
                filename: { type: string }
                title: { type: string, minLength: 1, maxLength: 120 }
                contentType: { type: string }
                size: { type: integer, format: int64, minimum: 1, maximum: 10737418240 }
                durationSec: { type: [number, "null"], minimum: 0 }
                partNumber: { type: integer, minimum: 1, maximum: 2048 }
      responses:
        "200": { description: Multipart session or signed part capability }
        "201": { description: Multipart session initiated }
        "202": { description: Upload accepted for asynchronous processing }
        "401": { description: Authentication required }
        "403": { description: Wrong expected owner }
  /upload/complete:
    post:
      operationId: completeClipUpload
      description: Complete and HEAD-validate R2 multipart object; transactionally enqueue verification. Does not probe or encode media.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId, expectedOwnerId, parts]
              properties:
                sessionId: { type: string, format: uuid }
                expectedOwnerId: { type: integer }
                title: { type: string }
                parts:
                  type: array
                  minItems: 1
                  maxItems: 2048
                  items:
                    type: object
                    required: [partNumber, etag]
                    properties:
                      partNumber: { type: integer, minimum: 1, maximum: 2048 }
                      etag: { type: string }
      responses:
        "202":
          description: Durable job accepted (also returned for duplicate completion)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClipUploadStatus" }
        "404": { description: Session not found for this owner }
        "409": { description: Object integrity or ownership mismatch }
  /upload/status/{sessionId}:
    get:
      operationId: getClipUploadStatus
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Owner-only processing status; ready receipt only after verified processing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClipUploadStatus" }
        "401": { description: Authentication required }
        "404": { description: Session not found for this owner }
  /citizen-profiles/meta:
    get:
      operationId: citizenMetadata
      responses:
        "200":
          description: Allowed Moroccan cities and interests
          content:
            application/json:
              schema: { type: object, properties: { cities: { type: array, items: { type: string } }, interests: { type: array, items: { type: string } } } }
  /citizen-profiles/me:
    get:
      operationId: citizenOwnProfile
      responses:
        "200":
          description: Own profile including privacy settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CitizenSocialProfile" }
    put:
      operationId: citizenSaveProfile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CitizenSocialUpdate" }
      responses:
        "200":
          description: Updated own profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CitizenSocialProfile" }
  /citizen-profiles:
    get:
      operationId: citizenDiscover
      parameters:
        - { in: query, name: city, schema: { type: string } }
        - { in: query, name: interest, schema: { type: string } }
        - { in: query, name: minAge, schema: { type: integer, minimum: 0, maximum: 130 } }
        - { in: query, name: maxAge, schema: { type: integer, minimum: 0, maximum: 130 } }
        - { in: query, name: matchmaking, schema: { type: boolean } }
      responses:
        "200":
          description: Privacy-filtered citizens
          content:
            application/json:
              schema: { type: object, required: [profiles], properties: { profiles: { type: array, items: { $ref: "#/components/schemas/CitizenSocialProfile" } } } }
  /citizen-profiles/map:
    get:
      operationId: citizenMap
      responses:
        "200":
          description: Consenting citizens with visible city only
          content:
            application/json:
              schema: { type: object, required: [profiles], properties: { profiles: { type: array, items: { $ref: "#/components/schemas/CitizenSocialProfile" } } } }
  /citizen-profiles/{username}:
    get:
      operationId: citizenPublicProfile
      parameters:
        - { in: path, name: username, required: true, schema: { type: string } }
      responses:
        "200":
          description: Authorized public projection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CitizenSocialProfile" }
  /citizen-profiles/{username}/follow:
    parameters:
      - { in: path, name: username, required: true, schema: { type: string } }
    post:
      operationId: citizenFollow
      responses:
        "200": { description: Followed }
    delete:
      operationId: citizenUnfollow
      responses:
        "200": { description: Unfollowed }
  /citizen-profiles/me/media:
    post:
      operationId: citizenUploadMedia
      parameters:
        - { in: query, name: kind, required: true, schema: { type: string, enum: [avatar, cover] } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/CitizenSocialMediaInput" }
      responses:
        "200":
          description: Persisted profile image URL
          content:
            application/json:
              schema: { type: object, required: [url], properties: { url: { type: string } } }
  /citizen-profiles/media/{id}/{kind}/{token}:
    get:
      operationId: citizenReadMedia
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
        - { in: path, name: kind, required: true, schema: { type: string, enum: [avatar, cover] } }
        - { in: path, name: token, required: true, schema: { type: string } }
      responses:
        "200": { description: "Authorized image bytes, private no-store cache policy" }
        "404": { description: Missing image or privacy access denied }
  /citizen-listings:
    get:
      operationId: citizenListListings
      parameters:
        - { in: query, name: type, schema: { type: string, enum: [market, service] } }
        - { in: query, name: city, schema: { type: string } }
      responses:
        "200":
          description: Authorized listings with seller projections
          content:
            application/json:
              schema: { type: object, properties: { listings: { type: array, items: { $ref: "#/components/schemas/CitizenSocialListing" } } } }
    post:
      operationId: citizenCreateListing
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CitizenSocialListingInput" }
      responses:
        "201":
          description: Created listing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CitizenSocialListing" }
  /citizen-listings/{id}:
    delete:
      operationId: citizenDeleteListing
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "200": { description: Deleted own listing }
  /ai/citizen-assistant:
    post:
      operationId: citizenAssistant
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CitizenSocialAssistantInput" }
      responses:
        "200":
          description: Consented assistance; heuristic explicitly labelled
          content:
            application/json:
              schema: { type: object, required: [text, method], properties: { text: { type: string }, method: { type: string }, compatibility: { $ref: "#/components/schemas/CitizenSocialCompatibility" } } }
        "503": { description: Optional AI unavailable }
  /admin/clips/thumbnails/exhausted:
    get:
      operationId: getExhaustedClipThumbnails
      summary: Inspect exhausted null-thumbnail clips
      parameters:
        - in: query
          name: before
          schema: { type: integer, minimum: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        "200":
          description: Exhausted clips in descending ID order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExhaustedClipThumbnailsPage"
        "400":
          description: Invalid cursor or limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Admin inspection rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/clips/thumbnails/{id}/requeue:
    post:
      operationId: requeueClipThumbnail
      summary: Requeue one eligible exhausted clip thumbnail
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Clip retry policy reset for asynchronous worker pickup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequeuedClipThumbnail"
        "400":
          description: Invalid clip ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Clip is stale, ineligible, or the retry worker is active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Admin requeue rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /clips/feed:
    get:
      operationId: getClipsFeed
      summary: Paginated visible clips with persistent, clip-scoped poster URLs
      parameters:
        - in: query
          name: before
          schema: { type: integer, minimum: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 10, default: 3 }
        - in: query
          name: q
          description: Case-insensitive literal search across title, clip code, and username
          schema: { type: string, maxLength: 100 }
      responses:
        "200":
          description: Newest visible clips; null thumb means no poster is available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClipsFeedPage"
        "400":
          description: Invalid cursor, limit, or search term
        "503":
          description: Feed temporarily unavailable; response is explicitly degraded
  /clips/{id}/save:
    post:
      operationId: toggleClipSave
      summary: Toggle the authenticated citizen's persistent clip bookmark
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Current bookmark state and global save count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClipSaveResult"
        "401": { description: Not authenticated }
        "404": { description: "Clip is frozen, deleted, or missing" }
  /clips/{id}/share:
    post:
      operationId: recordClipShare
      summary: Idempotently record one share for the authenticated citizen
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Share acknowledgement and global unique-citizen count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClipShareResult"
        "401": { description: Not authenticated }
        "404": { description: "Clip is frozen, deleted, or missing" }
  /clips/thumbnail/{id}:
    get:
      operationId: getClipThumbnail
      summary: Small JPEG poster for a non-frozen clip, without downloading video
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Persistent JPEG thumbnail
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        "400":
          description: Invalid clip ID
        "404":
          description: Clip frozen, deleted, or missing a thumbnail
        "500":
          description: Storage unavailable
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new player
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrationInput"
      responses:
        "201":
          description: Registered successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Already taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /call-push/config:
    get:
      operationId: getCallPushConfig
      tags: [call-push]
      summary: Get public Firebase web-call push configuration and readiness
      responses:
        "200":
          description: Firebase call push readiness
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallPushConfig"

  /call-push/session:
    post:
      operationId: createCallPushSession
      tags: [call-push]
      summary: Mint a Firebase custom token for the authenticated web session
      responses:
        "200":
          description: Firebase custom authentication token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallPushSession"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Firebase call push is not configured or unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /call-push/devices:
    post:
      operationId: registerCallPushDevice
      tags: [call-push]
      summary: Register or update this web installation's FCM token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CallPushDeviceInput"
      responses:
        "200":
          description: Device registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallPushOk"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Firebase call push is not configured or unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: unregisterCallPushDevice
      tags: [call-push]
      summary: Remove this authenticated web installation's FCM token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CallPushInstallationInput"
      responses:
        "200":
          description: Device removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallPushOk"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Firebase call push is not configured or unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /call-push/focus:
    post:
      operationId: setCallPushFocus
      tags: [call-push]
      summary: Update whether this web installation currently has focus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CallPushFocusInput"
      responses:
        "200":
          description: Focus state updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallPushOk"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Firebase call push is not configured or unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /call-push/missed:
    get:
      operationId: getMissedCalls
      tags: [call-push]
      summary: List missed and declined calls for the authenticated citizen
      responses:
        "200":
          description: Missed calls
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MissedCallsResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Firebase call push is not configured or unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /call-push/missed/seen:
    post:
      operationId: markMissedCallsSeen
      tags: [call-push]
      summary: Mark selected missed calls as seen
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MissedCallsSeenInput"
      responses:
        "200":
          description: Missed calls marked seen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallPushOk"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Firebase call push is not configured or unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /call/decline:
    post:
      operationId: declineCall
      tags: [call-push]
      summary: Decline a ringing call invitation as its authenticated callee
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9_-]{1,128}$'
      responses:
        "200":
          description: Call declined, or an already-terminal invitation was handled idempotently
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallDeclineResponse"
        "400":
          description: Invalid call ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Request origin is not allowed or caller is not the invited callee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Call invitation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Firebase call state is not configured or unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /leaderboard:
    get:
      operationId: getLeaderboard
      tags: [leaderboard]
      summary: Get top players
      responses:
        "200":
          description: Leaderboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaderboardResponse"

  /games/{gameId}/play:
    post:
      operationId: playGame
      tags: [games]
      summary: Play a game and earn coins
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Match result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayResult"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /messages/arena-withdraw:
    post:
      operationId: sendArenaWithdrawRequest
      tags: [messages]
      summary: Send a game prize request to Arena administration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArenaWithdrawInput"
      responses:
        "201":
          description: Request sent to Arena administration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArenaWithdrawResponse"
        "400":
          description: Invalid game
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Arena administration is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Request could not be sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /rewards/daily:
    post:
      operationId: claimDailyReward
      tags: [rewards]
      summary: Claim daily login reward
      responses:
        "200":
          description: Reward claimed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyRewardResult"
        "400":
          description: Already claimed today
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /gs/domains:
    get:
      operationId: getGsDomains
      tags: [globalstar]
      summary: Get all domains
      responses:
        "200":
          description: Domain list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GsDomainsResponse"

  /gs/figures:
    get:
      operationId: getGsFigures
      tags: [globalstar]
      summary: Get public figures (optionally filtered by domain)
      parameters:
        - name: domain
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Figure list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GsFiguresResponse"

  /gs/figures/{figureId}:
    get:
      operationId: getGsFigure
      tags: [globalstar]
      summary: Get a single figure with full stats
      parameters:
        - name: figureId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Figure detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GsFigureDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /gs/figures/{figureId}/vote:
    post:
      operationId: voteGsFigure
      tags: [globalstar]
      summary: Vote for a figure (like / support)
      parameters:
        - name: figureId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Vote recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GsVoteResult"
        "404":
          description: Figure not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /gs/ranking:
    get:
      operationId: getGsRanking
      tags: [globalstar]
      summary: Global ranking — top figures per domain
      responses:
        "200":
          description: Ranking by domain
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GsRankingResponse"

  /gs/news:
    get:
      operationId: getGsNews
      tags: [globalstar]
      summary: Get news articles (optionally filtered by domain)
      parameters:
        - name: domain
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: News list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GsNewsResponse"

  /gs/traditions:
    get:
      operationId: getGsTraditions
      tags: [globalstar]
      summary: Get traditions and archaeological sites
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Traditions list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GsTraditionsResponse"

  /gs/ticker:
    get:
      operationId: getGsTicker
      tags: [globalstar]
      summary: Get breaking news ticker items
      responses:
        "200":
          description: Ticker items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GsTickerResponse"

  /wallet/transactions:
    get:
      operationId: getTransactions
      tags: [wallet]
      summary: Get user transaction history
      responses:
        "200":
          description: Transaction list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionsResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    ClipUploadStatus:
      type: object
      required: [sessionId, state, statusUrl]
      properties:
        sessionId: { type: string, format: uuid }
        state: { type: string, enum: [queued, processing, ready, failed] }
        statusUrl: { type: string }
        receipt: { type: object, additionalProperties: true }
        error: { type: string }
    CitizenSocialMediaInput:
      type: object
      required: [image]
      properties:
        image: { type: string, description: Multipart image bytes, not a JSON string }
    CitizenSocialAssistantInput:
      type: object
      required: [section, consent]
      properties:
        section: { type: string, enum: [profile, matchmaking, market, services, helixly, map, translate, auto-reply] }
        consent: { type: boolean }
        username: { type: string, maxLength: 80 }
        clipId: { type: integer }
        listingId: { type: integer }
        prompt: { type: string, maxLength: 2000 }
        text: { type: string, maxLength: 4000 }
        targetLanguage: { type: string, maxLength: 80 }
    CitizenSocialVisibility:
      type: string
      enum: [everyone, friends, private]
    CitizenSocialUpdate:
      type: object
      additionalProperties: false
      properties:
        displayName: { type: string, minLength: 1, maxLength: 80 }
        bio: { type: string, maxLength: 1000 }
        city: { type: string, nullable: true }
        interests: { type: array, maxItems: 12, items: { type: string } }
        status: { type: string, enum: [available, busy, private] }
        visibility: { $ref: "#/components/schemas/CitizenSocialVisibility" }
        mapDiscoverable: { type: boolean }
        aiConsent: { type: boolean }
        fieldVisibility:
          type: object
          additionalProperties: { $ref: "#/components/schemas/CitizenSocialVisibility" }
    CitizenSocialCompatibility:
      type: object
      required: [percent, explanation, method]
      properties:
        percent: { type: integer }
        explanation: { type: string }
        method: { type: string, enum: [shared-interests-city-heuristic] }
    CitizenSocialProfile:
      type: object
      required: [userId, username, displayName, avatarUrl, coverUrl, city, age, bio, interests, status, visibility, stats, isFollowing, isFriend, isSelf, canMessage, videos, mapDiscoverable]
      properties:
        userId: { type: integer }
        username: { type: string }
        displayName: { type: string }
        avatarUrl: { type: string, nullable: true }
        coverUrl: { type: string, nullable: true }
        city: { type: string, nullable: true }
        age: { type: integer, nullable: true }
        bio: { type: string, nullable: true }
        interests: { type: array, items: { type: string } }
        status: { type: string, enum: [available, busy, private] }
        visibility: { $ref: "#/components/schemas/CitizenSocialVisibility" }
        stats:
          type: object
          required: [views, followers, following]
          properties: { views: { type: integer }, followers: { type: integer }, following: { type: integer } }
        isFollowing: { type: boolean }
        isFriend: { type: boolean }
        isSelf: { type: boolean }
        canMessage: { type: boolean }
        mapDiscoverable: { type: boolean }
        aiConsent: { type: boolean }
        fieldVisibility: { type: object, additionalProperties: { $ref: "#/components/schemas/CitizenSocialVisibility" } }
        compatibility: { $ref: "#/components/schemas/CitizenSocialCompatibility" }
        videos:
          type: array
          items:
            type: object
            required: [id, title, url, thumbnailUrl]
            properties: { id: { type: integer }, title: { type: string }, url: { type: string }, thumbnailUrl: { type: string, nullable: true } }
    CitizenSocialListingInput:
      type: object
      additionalProperties: false
      required: [type, title, description, price]
      properties:
        type: { type: string, enum: [market, service] }
        title: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, minLength: 1, maxLength: 2000 }
        price: { type: number, minimum: 0, maximum: 100000000 }
        city: { type: string, nullable: true }
    CitizenSocialListing:
      allOf:
        - { $ref: "#/components/schemas/CitizenSocialListingInput" }
        - type: object
          required: [id, createdAt, seller]
          properties:
            id: { type: integer }
            createdAt: { type: string }
            seller: { $ref: "#/components/schemas/CitizenSocialProfile" }
    ExhaustedClipThumbnail:
      type: object
      required: [id, title, username, createdAt, thumbnailRetryAttempts, thumbnailRetryAt, isFrozen]
      properties:
        id: { type: integer }
        title: { type: string }
        username: { type: string }
        createdAt: { type: string, format: date-time }
        thumbnailRetryAttempts: { type: integer }
        thumbnailRetryAt: { type: string, format: date-time }
        isFrozen: { type: boolean }
    ExhaustedClipThumbnailsPage:
      type: object
      required: [clips, nextBefore, maxAttempts]
      properties:
        clips:
          type: array
          items:
            $ref: "#/components/schemas/ExhaustedClipThumbnail"
        nextBefore: { type: [integer, "null"] }
        maxAttempts: { type: integer, enum: [8] }
    RequeuedClipThumbnail:
      type: object
      required: [id, thumbnailRetryAttempts, thumbnailRetryAt]
      properties:
        id: { type: integer }
        thumbnailRetryAttempts: { type: integer, enum: [0] }
        thumbnailRetryAt: { type: string, format: date-time }
    ClipFeedItem:
      type: object
      required: [id, user_id, username, title, content_type, duration_sec, views, created_at, thumb, author, saved, saveCount, shareCount]
      properties:
        id: { type: integer }
        user_id: { type: integer }
        username: { type: string }
        title: { type: string }
        content_type: { type: string }
        duration_sec: { type: integer, minimum: 60 }
        views: { type: integer }
        created_at: { type: string, format: date-time }
        author:
          $ref: "#/components/schemas/ClipAuthor"
        saved: { type: boolean }
        saveCount: { type: integer, minimum: 0 }
        shareCount: { type: integer, minimum: 0 }
        thumb:
          type: [string, "null"]
          description: Stable /api/clips/thumbnail/{id} URL, or null for legacy/failed posters
    ClipAuthor:
      type: object
      required: [id, username, avatarUrl]
      properties:
        id: { type: integer }
        username: { type: string }
        avatarUrl: { type: [string, "null"] }
    ClipSaveResult:
      type: object
      required: [saved, saveCount]
      properties:
        saved: { type: boolean }
        saveCount: { type: integer, minimum: 0 }
    ClipShareResult:
      type: object
      required: [shared, shareCount]
      properties:
        shared: { type: boolean, enum: [true] }
        shareCount: { type: integer, minimum: 0 }
    ClipsFeedPage:
      type: object
      required: [clips, hasMore, nextBefore]
      properties:
        clips:
          type: array
          items:
            $ref: "#/components/schemas/ClipFeedItem"
        hasMore: { type: boolean }
        nextBefore: { type: [integer, "null"] }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

    CallPushConfig:
      type: object
      properties:
        enabled:
          type: boolean
        reason:
          type: string
        pushEnabled:
          type: boolean
          description: Browser push readiness; Firestore may remain enabled when this is false.
        pushReason:
          type: string
        firebase:
          type: object
          properties:
            apiKey: { type: string }
            authDomain: { type: string }
            projectId: { type: string }
            messagingSenderId: { type: string }
            appId: { type: string }
          required: [apiKey, authDomain, projectId, messagingSenderId, appId]
        vapidPublicKey:
          type: string
      required: [enabled]

    CallPushSession:
      type: object
      properties:
        customToken: { type: string }
        userId: { type: string }
      required: [customToken, userId]

    CallPushOk:
      type: object
      properties:
        ok: { type: boolean }
      required: [ok]

    CallDeclineResponse:
      type: object
      properties:
        ok: { type: boolean }
        callId: { type: string }
        status:
          type: string
          enum: [declined, missed, answered, ringing, finished]
        changed: { type: boolean }
      required: [ok, callId, status, changed]

    CallPushDeviceInput:
      type: object
      properties:
        token:
          type: string
          minLength: 20
          maxLength: 4096
        installationId:
          type: string
          minLength: 16
          maxLength: 128
        focused: { type: boolean }
      required: [token, installationId, focused]

    CallPushInstallationInput:
      type: object
      properties:
        installationId:
          type: string
          minLength: 16
          maxLength: 128
      required: [installationId]

    CallPushFocusInput:
      type: object
      properties:
        installationId:
          type: string
          minLength: 16
          maxLength: 128
        focused: { type: boolean }
      required: [installationId, focused]

    MissedCallItem:
      type: object
      properties:
        id: { type: string }
        caller:
          type: object
          properties:
            id: { type: integer }
            name: { type: string }
            avatar:
              type: ["string", "null"]
          required: [id, name, avatar]
        type:
          type: string
          enum: [video, voice]
        time:
          type: string
          format: date-time
        isSeen: { type: boolean }
        status:
          type: string
          enum: [declined, missed]
      required: [id, caller, type, time, isSeen, status]

    MissedCallsResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MissedCallItem"
        unseenCount: { type: integer }
      required: [items, unseenCount]

    MissedCallsSeenInput:
      type: object
      properties:
        ids:
          type: array
          items:
            type: string
          minItems: 1
          maxItems: 100
      required: [ids]

    SuccessResponse:
      type: object
      properties:
        message:
          type: string
      required: [message]

    RegistrationInput:
      type: object
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 20
        password:
          type: string
          minLength: 6
        birthDate:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
      required: [username, password, birthDate]

    LoginInput:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
        rememberMe:
          type: boolean
      required: [username, password]

    AuthUser:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        balance:
          type: integer
        xp:
          type: integer
        gamesPlayed:
          type: integer
        wins:
          type: integer
        canClaimDaily:
          type: boolean
        isAdmin:
          type: boolean
        isAdult:
          type: boolean
          nullable: true
      required: [id, username, balance, xp, gamesPlayed, wins, canClaimDaily, isAdult]

    LeaderboardPlayer:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        balance:
          type: integer
        wins:
          type: integer
        gamesPlayed:
          type: integer
        xp:
          type: integer
      required: [id, username, balance, wins, gamesPlayed, xp]

    LeaderboardResponse:
      type: object
      properties:
        players:
          type: array
          items:
            $ref: "#/components/schemas/LeaderboardPlayer"
      required: [players]

    PlayResult:
      type: object
      properties:
        win:
          type: boolean
        coinsEarned:
          type: integer
        xpEarned:
          type: integer
        newBalance:
          type: integer
        newXp:
          type: integer
        message:
          type: string
      required: [win, coinsEarned, xpEarned, newBalance, newXp, message]

    ArenaWithdrawInput:
      type: object
      properties:
        gameId:
          type: string
          enum: [neon-racer, crypto-clash, arena-strike, globalstar]
      required: [gameId]

    ArenaWithdrawResponse:
      type: object
      properties:
        ok:
          type: boolean
        roomId:
          type: integer
        content:
          type: string
      required: [ok, roomId, content]

    DailyRewardResult:
      type: object
      properties:
        coinsEarned:
          type: integer
        newBalance:
          type: integer
        message:
          type: string
      required: [coinsEarned, newBalance, message]

    TransactionItem:
      type: object
      properties:
        id:
          type: integer
        amount:
          type: integer
        type:
          type: string
        description:
          type: string
        createdAt:
          type: string
      required: [id, amount, type, description, createdAt]

    GsDomain:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        icon:
          type: string
        figureCount:
          type: integer
        totalVotes:
          type: integer
      required: [id, label, icon, figureCount, totalVotes]

    GsDomainsResponse:
      type: object
      properties:
        domains:
          type: array
          items:
            $ref: "#/components/schemas/GsDomain"
      required: [domains]

    GsFigure:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        domain:
          type: string
        domainLabel:
          type: string
        nationality:
          type: string
        imageUrl:
          type: ["string", "null"]
        votes:
          type: integer
        rank:
          type: integer
        bio:
          type: string
      required: [id, name, domain, domainLabel, nationality, imageUrl, votes, rank, bio]

    GsFigureDetail:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        domain:
          type: string
        domainLabel:
          type: string
        nationality:
          type: string
        imageUrl:
          type: ["string", "null"]
        votes:
          type: integer
        rank:
          type: integer
        bio:
          type: string
        recentVotes:
          type: integer
        voteTrend:
          type: number
      required: [id, name, domain, domainLabel, nationality, imageUrl, votes, rank, bio, recentVotes, voteTrend]

    GsFiguresResponse:
      type: object
      properties:
        figures:
          type: array
          items:
            $ref: "#/components/schemas/GsFigure"
        total:
          type: integer
      required: [figures, total]

    GsVoteResult:
      type: object
      properties:
        figureId:
          type: integer
        newVotes:
          type: integer
        newRank:
          type: integer
        message:
          type: string
      required: [figureId, newVotes, newRank, message]

    GsDomainRanking:
      type: object
      properties:
        domain:
          type: string
        domainLabel:
          type: string
        icon:
          type: string
        figures:
          type: array
          items:
            $ref: "#/components/schemas/GsFigure"
      required: [domain, domainLabel, icon, figures]

    GsRankingResponse:
      type: object
      properties:
        ranking:
          type: array
          items:
            $ref: "#/components/schemas/GsDomainRanking"
        updatedAt:
          type: string
      required: [ranking, updatedAt]

    GsNewsArticle:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        summary:
          type: string
        domain:
          type: string
        domainLabel:
          type: string
        source:
          type: string
        publishedAt:
          type: string
        imageUrl:
          type: ["string", "null"]
        isBreaking:
          type: boolean
      required: [id, title, summary, domain, domainLabel, source, publishedAt, imageUrl, isBreaking]

    GsNewsResponse:
      type: object
      properties:
        articles:
          type: array
          items:
            $ref: "#/components/schemas/GsNewsArticle"
        total:
          type: integer
      required: [articles, total]

    GsTradition:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        country:
          type: string
        category:
          type: string
        description:
          type: string
        imageUrl:
          type: ["string", "null"]
        period:
          type: string
        isArchaeological:
          type: boolean
      required: [id, name, country, category, description, imageUrl, period, isArchaeological]

    GsTraditionsResponse:
      type: object
      properties:
        traditions:
          type: array
          items:
            $ref: "#/components/schemas/GsTradition"
        total:
          type: integer
      required: [traditions, total]

    GsTickerItem:
      type: object
      properties:
        id:
          type: integer
        text:
          type: string
        domain:
          type: string
        isBreaking:
          type: boolean
      required: [id, text, domain, isBreaking]

    GsTickerResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/GsTickerItem"
      required: [items]

    TransactionsResponse:
      type: object
      properties:
        transactions:
          type: array
          items:
            $ref: "#/components/schemas/TransactionItem"
        balance:
          type: integer
      required: [transactions, balance]
