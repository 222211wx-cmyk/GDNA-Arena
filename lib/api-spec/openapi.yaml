openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: leaderboard
  - name: games
  - name: rewards
  - name: wallet
  - name: globalstar
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new player
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterBody"
      responses:
        "201":
          description: Registered successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Already taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /leaderboard:
    get:
      operationId: getLeaderboard
      tags: [leaderboard]
      summary: Get top players
      responses:
        "200":
          description: Leaderboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaderboardResponse"

  /games/{gameId}/play:
    post:
      operationId: playGame
      tags: [games]
      summary: Play a game and earn coins
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Match result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayResult"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /rewards/daily:
    post:
      operationId: claimDailyReward
      tags: [rewards]
      summary: Claim daily login reward
      responses:
        "200":
          description: Reward claimed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyRewardResult"
        "400":
          description: Already claimed today
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /gs/domains:
    get:
      operationId: getGsDomains
      tags: [globalstar]
      summary: Get all domains
      responses:
        "200":
          description: Domain list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GsDomainsResponse"

  /gs/figures:
    get:
      operationId: getGsFigures
      tags: [globalstar]
      summary: Get public figures (optionally filtered by domain)
      parameters:
        - name: domain
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Figure list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GsFiguresResponse"

  /gs/figures/{figureId}:
    get:
      operationId: getGsFigure
      tags: [globalstar]
      summary: Get a single figure with full stats
      parameters:
        - name: figureId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Figure detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GsFigureDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /gs/figures/{figureId}/vote:
    post:
      operationId: voteGsFigure
      tags: [globalstar]
      summary: Vote for a figure (like / support)
      parameters:
        - name: figureId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Vote recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GsVoteResult"
        "404":
          description: Figure not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /gs/ranking:
    get:
      operationId: getGsRanking
      tags: [globalstar]
      summary: Global ranking — top figures per domain
      responses:
        "200":
          description: Ranking by domain
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GsRankingResponse"

  /gs/news:
    get:
      operationId: getGsNews
      tags: [globalstar]
      summary: Get news articles (optionally filtered by domain)
      parameters:
        - name: domain
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: News list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GsNewsResponse"

  /gs/traditions:
    get:
      operationId: getGsTraditions
      tags: [globalstar]
      summary: Get traditions and archaeological sites
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Traditions list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GsTraditionsResponse"

  /gs/ticker:
    get:
      operationId: getGsTicker
      tags: [globalstar]
      summary: Get breaking news ticker items
      responses:
        "200":
          description: Ticker items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GsTickerResponse"

  /wallet/transactions:
    get:
      operationId: getTransactions
      tags: [wallet]
      summary: Get user transaction history
      responses:
        "200":
          description: Transaction list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionsResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

    SuccessResponse:
      type: object
      properties:
        message:
          type: string
      required: [message]

    RegisterBody:
      type: object
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 20
        password:
          type: string
          minLength: 6
        birthDate:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
      required: [username, password, birthDate]

    LoginBody:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
        rememberMe:
          type: boolean
      required: [username, password]

    AuthUser:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        balance:
          type: integer
        xp:
          type: integer
        gamesPlayed:
          type: integer
        wins:
          type: integer
        canClaimDaily:
          type: boolean
        isAdmin:
          type: boolean
        isAdult:
          type: boolean
          nullable: true
      required: [id, username, balance, xp, gamesPlayed, wins, canClaimDaily, isAdult]

    LeaderboardPlayer:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        balance:
          type: integer
        wins:
          type: integer
        gamesPlayed:
          type: integer
        xp:
          type: integer
      required: [id, username, balance, wins, gamesPlayed, xp]

    LeaderboardResponse:
      type: object
      properties:
        players:
          type: array
          items:
            $ref: "#/components/schemas/LeaderboardPlayer"
      required: [players]

    PlayResult:
      type: object
      properties:
        win:
          type: boolean
        coinsEarned:
          type: integer
        xpEarned:
          type: integer
        newBalance:
          type: integer
        newXp:
          type: integer
        message:
          type: string
      required: [win, coinsEarned, xpEarned, newBalance, newXp, message]

    DailyRewardResult:
      type: object
      properties:
        coinsEarned:
          type: integer
        newBalance:
          type: integer
        message:
          type: string
      required: [coinsEarned, newBalance, message]

    TransactionItem:
      type: object
      properties:
        id:
          type: integer
        amount:
          type: integer
        type:
          type: string
        description:
          type: string
        createdAt:
          type: string
      required: [id, amount, type, description, createdAt]

    GsDomain:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        icon:
          type: string
        figureCount:
          type: integer
        totalVotes:
          type: integer
      required: [id, label, icon, figureCount, totalVotes]

    GsDomainsResponse:
      type: object
      properties:
        domains:
          type: array
          items:
            $ref: "#/components/schemas/GsDomain"
      required: [domains]

    GsFigure:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        domain:
          type: string
        domainLabel:
          type: string
        nationality:
          type: string
        imageUrl:
          type: ["string", "null"]
        votes:
          type: integer
        rank:
          type: integer
        bio:
          type: string
      required: [id, name, domain, domainLabel, nationality, imageUrl, votes, rank, bio]

    GsFigureDetail:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        domain:
          type: string
        domainLabel:
          type: string
        nationality:
          type: string
        imageUrl:
          type: ["string", "null"]
        votes:
          type: integer
        rank:
          type: integer
        bio:
          type: string
        recentVotes:
          type: integer
        voteTrend:
          type: number
      required: [id, name, domain, domainLabel, nationality, imageUrl, votes, rank, bio, recentVotes, voteTrend]

    GsFiguresResponse:
      type: object
      properties:
        figures:
          type: array
          items:
            $ref: "#/components/schemas/GsFigure"
        total:
          type: integer
      required: [figures, total]

    GsVoteResult:
      type: object
      properties:
        figureId:
          type: integer
        newVotes:
          type: integer
        newRank:
          type: integer
        message:
          type: string
      required: [figureId, newVotes, newRank, message]

    GsDomainRanking:
      type: object
      properties:
        domain:
          type: string
        domainLabel:
          type: string
        icon:
          type: string
        figures:
          type: array
          items:
            $ref: "#/components/schemas/GsFigure"
      required: [domain, domainLabel, icon, figures]

    GsRankingResponse:
      type: object
      properties:
        ranking:
          type: array
          items:
            $ref: "#/components/schemas/GsDomainRanking"
        updatedAt:
          type: string
      required: [ranking, updatedAt]

    GsNewsArticle:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        summary:
          type: string
        domain:
          type: string
        domainLabel:
          type: string
        source:
          type: string
        publishedAt:
          type: string
        imageUrl:
          type: ["string", "null"]
        isBreaking:
          type: boolean
      required: [id, title, summary, domain, domainLabel, source, publishedAt, imageUrl, isBreaking]

    GsNewsResponse:
      type: object
      properties:
        articles:
          type: array
          items:
            $ref: "#/components/schemas/GsNewsArticle"
        total:
          type: integer
      required: [articles, total]

    GsTradition:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        country:
          type: string
        category:
          type: string
        description:
          type: string
        imageUrl:
          type: ["string", "null"]
        period:
          type: string
        isArchaeological:
          type: boolean
      required: [id, name, country, category, description, imageUrl, period, isArchaeological]

    GsTraditionsResponse:
      type: object
      properties:
        traditions:
          type: array
          items:
            $ref: "#/components/schemas/GsTradition"
        total:
          type: integer
      required: [traditions, total]

    GsTickerItem:
      type: object
      properties:
        id:
          type: integer
        text:
          type: string
        domain:
          type: string
        isBreaking:
          type: boolean
      required: [id, text, domain, isBreaking]

    GsTickerResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/GsTickerItem"
      required: [items]

    TransactionsResponse:
      type: object
      properties:
        transactions:
          type: array
          items:
            $ref: "#/components/schemas/TransactionItem"
        balance:
          type: integer
      required: [transactions, balance]
